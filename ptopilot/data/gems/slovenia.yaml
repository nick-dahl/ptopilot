headline: Ten days that go from a car-free capital to Alpine lakes, an emerald river and a Venetian harbour town, with no drive longer than an afternoon.
body: |
  Slovenia packs a whole European holiday into a country smaller than New Jersey. In ten days you get a capital with real café life, lakes under the Julian Alps, a river so green it looks dyed, caves big enough to swallow a cathedral, and a harbour town on the Adriatic, with none of the drives longer than an afternoon. Most of your friends will have heard of Lake Bled and nothing else, which is exactly why it's worth going.

  ## Days 1–2: Ljubljana

  Land in **Ljubljana** and walk everything: the old town along the river has been car-free since 2007, so it's all cafés on the riverbank, bridges every few minutes and the castle on the hill. If you're there on a Friday from spring into October, eat at **Odprta kuhna** (Open Kitchen) on Pogačarjev trg, the best cheap dinner in town.

  ## Days 3–4: Bled and Bohinj

  Pick up a car or take the bus, about an hour to **Lake Bled**. See it early in the morning, then move on to **Lake Bohinj** half an hour further in, which is bigger, wilder and far quieter. You're now inside **Triglav National Park**, the country's only national park, and the hiking starts at the lakeshore.

  ## Days 5–7: over Vršič into the Soča valley

  Drive the **Vršič Pass**, Slovenia's highest road pass at 1,611 m and around 50 hairpins, down into the Trenta and **Soča valley**. This is the heart of the trip: walk the river's gorges, swim if you're brave, raft or kayak out of **Bovec**, and base yourself in a campsite or guesthouse along the water for three nights.

  ## Day 8: the Karst

  Cut south to the **Škocjan Caves**, a UNESCO World Heritage Site since 1986, where an underground river runs through a canyon you walk across on a bridge high above it. The Karst around it is also wine and cured-ham country, so stop for lunch on the way.

  ## Days 9–10: Piran

  Finish on the coast in **Piran**, a little Venetian-built town on a point in the Adriatic: swim off the rocks, eat grilled fish on the harbour, watch the sun go down over the sea. It's a couple of hours back to Ljubljana for the flight home.

  ## The catch

  You really want a car for the Alps and the Soča valley; buses get you to Bled and the coast, but not over Vršič. The pass closes in winter (roughly November to spring), so this trip is a summer-to-early-autumn one. And Bled in August is busy: get there early or stay in Bohinj.
budget: Split a small rental car between two and it's the cheapest way to cover the Alps and the Soča valley. Sleep in campsites along the Soča and guesthouses elsewhere, eat burek and market food in Ljubljana and set lunches (malica) in the countryside, and save the splurge for fish in Piran. Day trips need no tickets beyond the cave entry.
