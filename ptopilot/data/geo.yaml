# Seed geography. Extend as friends add destinations.
# zone: coarse region used for travel-time rules; country: ISO 3166 alpha-2.
airports:
  ORD: {country: US, zone: NA}
  MDW: {country: US, zone: NA}
  JFK: {country: US, zone: NA}
  EWR: {country: US, zone: NA}
  LGA: {country: US, zone: NA}
  PHL: {country: US, zone: NA}
  SFO: {country: US, zone: NA}
  LAX: {country: US, zone: NA}
  LHR: {country: GB, zone: EUROPE}
  LGW: {country: GB, zone: EUROPE}
  LIS: {country: PT, zone: EUROPE}
  OPO: {country: PT, zone: EUROPE}
  PDL: {country: PT, zone: EUROPE}  # Ponta Delgada, Azores
  FNC: {country: PT, zone: EUROPE}  # Funchal, Madeira
  SCQ: {country: ES, zone: EUROPE}  # Santiago de Compostela
  PUQ: {country: CL, zone: S_AMERICA}  # Punta Arenas (gateway to Torres del Paine)
  BKK: {country: TH, zone: SE_ASIA}
  HKT: {country: TH, zone: SE_ASIA}
  CNX: {country: TH, zone: SE_ASIA}
  HND: {country: JP, zone: E_ASIA}
  NRT: {country: JP, zone: E_ASIA}

# color: header and accent color in the web app and digest (#rrggbb); optional, defaults by zone.
# photo: the hand-picked cover photo, a Wikimedia Commons thumbnail (1280 px wide) with its attribution.
#   Free licences only (CC0, CC BY, CC BY-SA, public domain); source_url is the Commons file page.
destinations:
  TH:
    name: Thailand
    kind: region
    airports: [BKK, HKT, CNX]
    color: "#047857"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/KohPhiPhi.JPG/1280px-KohPhiPhi.JPG
      width: 1280
      height: 848
      author: "Luxure"
      licence: "CC BY 3.0 au"
      source_url: "https://commons.wikimedia.org/wiki/File:KohPhiPhi.JPG"
  LIS:
    name: Lisbon
    kind: city
    airports: [LIS]
    color: "#1d4ed8"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Lisbon_alfalma.jpg/1280px-Lisbon_alfalma.jpg
      width: 1280
      height: 719
      author: "Arne Müseler"
      licence: "CC BY-SA 3.0 de"
      source_url: "https://commons.wikimedia.org/wiki/File:Lisbon_alfalma.jpg"
  TYO:
    name: Tokyo
    kind: city
    airports: [HND, NRT]
    color: "#be123c"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Tokyo_-_Sunset_Skyline.jpg/1280px-Tokyo_-_Sunset_Skyline.jpg
      width: 1280
      height: 853
      author: "Fred Cherrygarden"
      licence: "CC BY-SA 4.0"
      source_url: "https://commons.wikimedia.org/wiki/File:Tokyo_-_Sunset_Skyline.jpg"
  PATAGONIA:
    name: "Patagonia (W Trek)"
    kind: region
    airports: [PUQ]
    color: "#7c2d12"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Cuernos_del_Paine%2C_Parque_Nacional_Torres_del_Paine%2C_Chile6.jpg/1280px-Cuernos_del_Paine%2C_Parque_Nacional_Torres_del_Paine%2C_Chile6.jpg
      width: 1280
      height: 853
      author: "Diego Delso"
      licence: "CC BY-SA 3.0"
      source_url: "https://commons.wikimedia.org/wiki/File:Cuernos_del_Paine,_Parque_Nacional_Torres_del_Paine,_Chile6.jpg"
  AZORES:
    name: Azores
    kind: region
    airports: [PDL]
    color: "#0e7490"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Lagoa_das_Sete_Cidades_seen_from_Miradouro_da_Vista_do_Rei_2011.jpg/1280px-Lagoa_das_Sete_Cidades_seen_from_Miradouro_da_Vista_do_Rei_2011.jpg
      width: 1280
      height: 722
      author: "JopkeB"
      licence: "CC BY-SA 4.0"
      source_url: "https://commons.wikimedia.org/wiki/File:Lagoa_das_Sete_Cidades_seen_from_Miradouro_da_Vista_do_Rei_2011.jpg"
  MADEIRA:
    name: Madeira
    kind: region
    airports: [FNC]
    color: "#15803d"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Pico_do_Areeiro%2C_2025.jpg/1280px-Pico_do_Areeiro%2C_2025.jpg
      width: 1280
      height: 720
      author: "Krib"
      licence: "CC BY-SA 4.0"
      source_url: "https://commons.wikimedia.org/wiki/File:Pico_do_Areeiro,_2025.jpg"
  # Open-jaw: fly into the first list, home from the second.
  CAMINO_PORTUGUES:
    name: "Camino Portugués (Porto → Santiago)"
    kind: route
    airports: [OPO]
    return_airports: [SCQ]
    color: "#a16207"
    photo:
      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Ponte_de_Lima_Bridge.jpg/1280px-Ponte_de_Lima_Bridge.jpg
      width: 1280
      height: 820
      author: "Alejandro Piñero Amerio"
      licence: "CC BY-SA 4.0"
      source_url: "https://commons.wikimedia.org/wiki/File:Ponte_de_Lima_Bridge.jpg"

# overhead_days: round-trip travel days subtracted from time on the ground.
# min_trip_days: shortest trip worth taking between the two zones.
travel:
  default: {overhead_days: 1, min_trip_days: 2}
  pairs:
    - {zones: [NA, NA], overhead_days: 1, min_trip_days: 3}
    - {zones: [NA, EUROPE], overhead_days: 2, min_trip_days: 5}
    - {zones: [NA, SE_ASIA], overhead_days: 3, min_trip_days: 9}
    - {zones: [NA, E_ASIA], overhead_days: 2.5, min_trip_days: 7}
    - {zones: [EUROPE, EUROPE], overhead_days: 1, min_trip_days: 2}
    - {zones: [EUROPE, SE_ASIA], overhead_days: 2.5, min_trip_days: 8}
    - {zones: [EUROPE, E_ASIA], overhead_days: 2.5, min_trip_days: 7}
    - {zones: [NA, S_AMERICA], overhead_days: 3, min_trip_days: 9}
    - {zones: [EUROPE, S_AMERICA], overhead_days: 3, min_trip_days: 9}
