name: scan
on:
  schedule:
    - cron: "0 6 * * *"  # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today, UTC)"
        required: false
      stage:
        description: "Run only this stage (blank = all)"
        required: false
        type: choice
        options: ["", expand, broad_scan, shortlist, seed_history, live_verify, baselines, score, related, gems, photos, alerts, prune]
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # ~140 paced live checks take 25-30 minutes
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}  # instant alerts' snooze links; must match the web app's
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}  # empty = alerts without snooze links
      RUN_DATE: ${{ inputs.date }}  # passed via env, never spliced into the shell script
      RUN_STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m alembic upgrade head
      - name: Run pipeline
        run: |
          args=(run)
          if [ -n "$RUN_DATE" ]; then args+=(--date "$RUN_DATE"); fi
          if [ -n "$RUN_STAGE" ]; then args+=(--stage "$RUN_STAGE"); fi
          python -m ptopilot.pipeline "${args[@]}"
      # Covers cancels and the timeout-minutes kill. After an ordinary stage failure the pipeline has
      # finished its stages, so `interrupted` finds no running rows and sends nothing.
      - name: Report an interrupted run
        if: ${{ !success() }}
        run: python -m ptopilot.pipeline interrupted
