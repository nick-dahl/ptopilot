  ## Getting there

  Fly into **Bodø** and take the morning ferry out; fly home from Svolvær.

  - Camp on open land away from houses
  - Carry a stove: fires are banned in summer

  The ferry timetable is on [the operator's site](https://example.org/hoegvik/ferry).
